# @generated by conventions.init — do not edit manually
# Stack: TypeScript + Biome (Bun)
# WARNING: action tags are unpinned. Pin to SHA before using in production.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Get changed JS/TS files
        id: changed-src
        uses: tj-actions/changed-files@v45
        with:
          separator: "\n"
          files: |
            **/*.ts
            **/*.tsx
            **/*.js
            **/*.jsx

      - name: Get changed config files
        id: changed-cfg
        uses: tj-actions/changed-files@v45
        with:
          files: |
            biome.json
            biome.jsonc
            tsconfig.json
            tsconfig.*.json

      - name: Format check
        shell: bash
        env:
          CFG_CHANGED: ${{ steps.changed-cfg.outputs.any_changed }}
          SRC_FILES: ${{ steps.changed-src.outputs.all_changed_files }}
        run: |
          if [ "$CFG_CHANGED" = "true" ]; then
            bunx biome format --check .
          elif [ -n "$SRC_FILES" ]; then
            mapfile -t files <<< "$SRC_FILES"
            bunx biome format --check "${files[@]}"
          else
            echo "No JS/TS changes, skipping format check."
          fi

      - name: Lint
        shell: bash
        env:
          CFG_CHANGED: ${{ steps.changed-cfg.outputs.any_changed }}
          SRC_FILES: ${{ steps.changed-src.outputs.all_changed_files }}
        run: |
          if [ "$CFG_CHANGED" = "true" ]; then
            bunx biome check .
          elif [ -n "$SRC_FILES" ]; then
            mapfile -t files <<< "$SRC_FILES"
            bunx biome check "${files[@]}"
          else
            echo "No JS/TS changes, skipping lint."
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
